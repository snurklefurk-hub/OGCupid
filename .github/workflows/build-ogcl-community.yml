name: Build OGC Community React release candidate
on:
  push:
    branches: [feature/community-chatroom-20261119]
    paths:
      - 'ogc-l-react/**'
      - 'member-app/**'
      - '.github/workflows/build-ogcl-community.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ogcl-community-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend deps
        run: |
          npm ci --prefix member-app
          npm ci --prefix ogc-l-react
      - name: Test all React and account regressions
        run: |
          npm test --prefix ogc-l-react
          npm test --prefix member-app
      - name: Build rollback account fallback
        run: npm run build --prefix member-app
        env:
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: 'true'
          VITE_OGCL_LIVE_CUTOVER: 'true'
      - name: Build React production root without clearing public pages
        run: npm run build --prefix ogc-l-react
        env:
          OGCL_PRODUCTION_ROOT: 'true'
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: 'true'
      - name: Verify production root and preserve legal pages
        run: |
          OGCL_PRODUCTION_ROOT=true node scripts/publish-ogcl-production.mjs
          test -s public/account/index.html
          test -s public/account/persona.html
          test -s public/privacy/index.html
          test -s public/terms/index.html
          test -s public/ogtrends/index.html
          grep -q '/assets/' index.html
          ! grep -q 'noindex,nofollow' index.html
      - name: Commit reviewed static assets to feature branch, never live main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f index.html public/index.html public/assets public/account
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Community tab in compiled React"
            for retry in 1 2 3; do
              git pull --rebase origin feature/community-chatroom-20261119
              if git push origin HEAD:feature/community-chatroom-20261119; then exit 0; fi
            done
            exit 1
          fi
