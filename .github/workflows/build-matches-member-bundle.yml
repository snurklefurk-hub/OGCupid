name: Build isolated Matches/Blocks member Function bundle
on:
  push:
    branches: [feature/matches-quiver-favorites-sitewide-blocks]
    paths:
      - 'api/**'
      - '.github/workflows/build-matches-member-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-matches-member-bundle
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save esbuild@0.25.12
      - name: Validate handlers and bundle Neon members Function
        run: |
          node --check api/member-connections.js
          node --check api/member-messages.js
          node --test api/member-connections.test.js api/member-messages.test.js > dev/matches-member-tests.log 2>&1 || { cat dev/matches-member-tests.log; exit 1; }
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          cd "$RUNNER_TEMP"
          zip -9 members.zip index.mjs
          base64 -w0 members.zip > "$GITHUB_WORKSPACE/dev/matches-member-bundle.b64"
      - name: Commit build diagnostic and bundle only to isolated feature branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/matches-member-bundle.b64 dev/matches-member-tests.log 2>/dev/null || git add dev/matches-member-tests.log
          if ! git diff --cached --quiet; then
            git commit -m "build: stage Matches Neon member Function ZIP on feature branch"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin feature/matches-quiver-favorites-sitewide-blocks
              if git push origin HEAD:feature/matches-quiver-favorites-sitewide-blocks; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
