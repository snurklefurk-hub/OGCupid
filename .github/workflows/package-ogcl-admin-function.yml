name: Package OGC-L admin member Function for controlled Neon rollout
on:
  push:
    branches: [feature/ogcl-admin-dashboard-20261119]
    paths:
      - 'api/member-admin.js'
      - 'api/member-profile.ts'
      - 'api/member-admin.test.js'
      - '.github/workflows/package-ogcl-admin-function.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and bundle current member Function
        run: |
          npm ci
          npm install --no-save esbuild@0.25.12
          node --test api/member-admin.test.js api/member-messages.test.js api/member-quickmatch.test.js
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          (cd "$RUNNER_TEMP" && zip -9 -q members.zip index.mjs)
          base64 -w0 "$RUNNER_TEMP/members.zip" > dev/ogcl-admin-members-function.b64
      - name: Save no-credentials deployment artifact to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dev/ogcl-admin-members-function.b64
          if ! git diff --cached --quiet; then
            git commit -m "build: package admin-enabled Neon member Function"
            git pull --rebase origin feature/ogcl-admin-dashboard-20261119
            git push origin HEAD:feature/ogcl-admin-dashboard-20261119
          fi
