name: Package OG Cupid production member UI (one-time release build)
on:
  push:
    paths:
      - ".github/workflows/package-members-once.yml"

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build member UI against production endpoints
        shell: bash
        env:
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: "true"
        run: |
          set -euo pipefail
          npm --prefix member-app install --no-audit --no-fund
          npm --prefix member-app run build
          test -s public/account/index.html
          grep -q "assets/index-" public/account/index.html
          echo "Production member app build succeeded"
      - name: Commit versioned production member assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A public/account
          if git diff --cached --quiet; then
            echo "Member UI assets already up to date"
          else
            git commit -m "build: publish production self-service member deletion UI"
            git push origin HEAD:main
          fi
