name: Package reconciled pair-state member Function
on:
  push:
    branches: [feature/ogcl-quickmatch-pair-reconciled-20261118]
    paths:
      - 'api/member-quickmatch.js'
      - 'api/member-discovery.js'
      - 'api/member-profile.ts'
      - 'ogc-l-react/src/*'
      - '.github/workflows/package-ogcl-quickmatch-reconciled.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify pair-state, messaging and React before member Function bundle
        run: |
          npm ci
          node --test api/member-quickmatch.test.js api/quickmatch-score-adjustment.test.js api/discovery-route.test.js api/discovery-score.test.js api/member-messages.test.js api/profile-route.test.js
          npm --prefix ogc-l-react install --no-audit --no-fund
          npm --prefix ogc-l-react test
          npm --prefix ogc-l-react run build
          npm install --no-save esbuild@0.25.12
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          (cd "$RUNNER_TEMP" && zip -9 -q members.zip index.mjs)
          base64 -w0 "$RUNNER_TEMP/members.zip" > dev/ogcl-reconciled-pair-members-function.b64
      - name: Commit credential-free bundle on isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dev/ogcl-reconciled-pair-members-function.b64
          if ! git diff --cached --quiet; then
            git commit -m "build: package reconciled Quickmatch pair Function"
            git pull --rebase origin feature/ogcl-quickmatch-pair-reconciled-20261118
            git push origin HEAD:feature/ogcl-quickmatch-pair-reconciled-20261118
          fi
