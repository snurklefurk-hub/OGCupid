name: Retire sitewide feedback and publish clean OG Cupid candidate
on:
  push:
    branches: [chore/remove-sitewide-feedback-20261119]
    paths:
      - 'api/**'
      - 'member-app/**'
      - 'ogc-l-react/**'
      - 'public/**'
      - 'index.html'
      - 'scripts/publish-ogcl-production.mjs'
      - 'scripts/retired-feedback.test.mjs'
      - '.github/workflows/remove-feedback-release.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: |
          npm ci
          npm ci --prefix member-app
          npm ci --prefix ogc-l-react
          npm install --no-save esbuild@0.25.12
      - name: Test retirement and existing Community
        run: |
          node --test scripts/retired-feedback.test.mjs api/member-community.test.js
          npm test --prefix member-app
          npm test --prefix ogc-l-react
      - name: Publish clean fallback account/Persona pages
        run: npm run build --prefix member-app
        env:
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: 'true'
          VITE_OGCL_LIVE_CUTOVER: 'true'
      - name: Build clean production React root
        run: npm run build --prefix ogc-l-react
        env:
          OGCL_PRODUCTION_ROOT: 'true'
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: 'true'
      - name: Publish and verify compiled pages without feedback
        run: |
          OGCL_PRODUCTION_ROOT=true node scripts/publish-ogcl-production.mjs
          node --test scripts/retired-feedback.test.mjs
      - name: Package Neon member Function without feedback endpoint
        run: |
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          ! grep -q 'submit_site_feedback' "$RUNNER_TEMP/index.mjs"
          (cd "$RUNNER_TEMP" && zip -9 -q members.zip index.mjs)
          mkdir -p dev
          base64 -w0 "$RUNNER_TEMP/members.zip" > dev/no-feedback-members-function.b64
      - name: Save validated release assets in feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f index.html public/index.html public/assets public/account dev/no-feedback-members-function.b64
          if ! git diff --cached --quiet; then
            git commit -m "build: bundle OG Cupid without retired feedback"
            for retry in 1 2 3; do
              git pull --rebase origin chore/remove-sitewide-feedback-20261119
              if git push origin HEAD:chore/remove-sitewide-feedback-20261119; then exit 0; fi
            done
            exit 1
          fi
