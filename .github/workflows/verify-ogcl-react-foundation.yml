name: Verify OGC-L React/Vite foundation
on:
  pull_request:
    branches: [OGC-lovable]
    paths:
      - 'ogc-l-react/**'
      - '.github/workflows/verify-ogcl-react-foundation.yml'
  push:
    branches: [feature/ogcl-react-vite-shell-foundation]
    paths:
      - 'ogc-l-react/**'
      - '.github/workflows/verify-ogcl-react-foundation.yml'
permissions:
  contents: read
jobs:
  react-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated preview dependencies
        working-directory: ogc-l-react
        run: npm install --no-audit --no-fund
      - name: Verify main navigation invariants
        working-directory: ogc-l-react
        run: npm test
      - name: Compile isolated React/Vite shell
        working-directory: ogc-l-react
        run: npm run build
      - name: Guard live application files
        run: |
          test -s public/ogc-l/index.html
          grep -q 'ogc-l/assets/' public/ogc-l/index.html
          git diff --quiet -- index.html public/account public/profiles
