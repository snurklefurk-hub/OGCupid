name: Package canonical onboarding function for isolated Neon branch
on:
  push:
    branches: [feature/canonical-onboarding]
    paths:
      - 'api/**'
      - '.github/workflows/package-canonical-api.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked backend dependencies
        run: |
          npm ci
          npm install --no-save esbuild@0.25.12
      - name: Compile function and package
        run: |
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          (cd "$RUNNER_TEMP" && zip -9 -q canonical-members.zip index.mjs)
          base64 -w0 "$RUNNER_TEMP/canonical-members.zip" > dev/canonical-members-function-bundle.b64
      - name: Save only the nonsecret compiled bundle to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/canonical-members-function-bundle.b64
          if ! git diff --cached --quiet; then
            git commit -m "build: package canonical onboarding API for Neon dev"
            git pull --rebase origin feature/canonical-onboarding
            git push origin HEAD:feature/canonical-onboarding
          fi
