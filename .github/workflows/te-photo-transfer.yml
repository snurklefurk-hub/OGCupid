name: Temporary OG Cupid T+E photo transfer
on:
  push:
    branches:
      - fix/restore-stored-test-photos-20261119
    paths:
      - .github/workflows/te-photo-transfer.yml
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'snurklefurk-hub/OGCupid'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload ten existing photographs to test-only Neon storage keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --max-time 240 \
            -X POST \
            -H 'x-neon-trigger-invocation-id: one-time-github-action' \
            -H 'content-type: application/json' \
            -d '{}' \
            'https://br-plain-unit-bbcbxpqq-tephotos.compute.c-15.us-east-1.aws.neon.tech/' > /tmp/tephotos.json
          python3 - <<'PY'
          import json
          with open('/tmp/tephotos.json',encoding='utf-8') as f:
              result=json.load(f)['results']
          for record in result:
              print(record['name'], 'UPLOADED' if record['ok'] else record.get('error'),record.get('bytes'))
          assert len(result)==10 and all(x['ok'] for x in result), 'Some image uploads failed'
          PY
