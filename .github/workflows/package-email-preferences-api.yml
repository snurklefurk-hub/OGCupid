name: Build member email-preferences API bundle (one-time)
on:
  push:
    paths:
      - ".github/workflows/package-email-preferences-api.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle member API and syntax-check output
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx --yes esbuild@0.25.12 api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --outfile=.temporary/index.mjs --external:pg-native --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
          node --check .temporary/index.mjs
          (cd .temporary && zip -q -X -9 member-email-preferences.zip index.mjs)
          base64 -w0 .temporary/member-email-preferences.zip > .temporary/member-email-preferences.b64
          printf '\n' >> .temporary/member-email-preferences.b64
          test -s .temporary/member-email-preferences.b64
          echo "Email-preferences API bundle packaged"
      - name: Temporarily publish deployment bundle for Neon connector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .temporary/member-email-preferences.b64
          git commit -m "build: temporary member email-preferences API bundle"
          git push origin HEAD:main
