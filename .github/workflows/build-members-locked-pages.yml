# Rebuild member Persona branding after the original header was added.
name: Publish OG Cupid member-only pages (one-time)
on:
  push:
    paths:
      - ".github/workflows/build-members-locked-pages.yml"

permissions:
  contents: write

jobs:
  publish-member-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test question flow and build authenticated member app
        shell: bash
        env:
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: "true"
        run: |
          set -euo pipefail
          npm --prefix member-app install --no-audit --no-fund
          npm --prefix member-app test
          npm --prefix member-app run build
          test -s public/account/index.html
          test -s public/account/persona.html
          grep -q 'brand/og-cupid-arrow.svg' public/account/index.html
          grep -q 'persona-gate' member-app/persona.html
          echo "Member account and Persona pages compiled"
      - name: Publish generated static assets for Render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A public/account
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: publish member-only quiz, logo and mobile account styling"
            git push origin HEAD:main
          fi
