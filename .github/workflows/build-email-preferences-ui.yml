name: Publish member email preferences UI (one-time)
on:
  push:
    paths:
      - ".github/workflows/build-email-preferences-ui.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test question flow and build production member pages
        shell: bash
        env:
          VITE_OGC_AUTH_URL: https://ep-hidden-breeze-bbdn5nsb.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth
          VITE_OGC_MEMBER_API_URL: https://br-plain-unit-bbcbxpqq-members.compute.c-15.us-east-1.aws.neon.tech/profile
          VITE_OGC_REGISTRATION_ENABLED: "true"
        run: |
          set -euo pipefail
          npm --prefix member-app install --no-audit --no-fund
          npm --prefix member-app test
          npm --prefix member-app run build
          test -s public/account/index.html
          test -s public/account/persona.html
          grep -q 'id="signup-email-options"' public/account/index.html
          grep -q 'id="email-settings-form"' public/account/index.html
          grep -q 'We won' public/account/index.html
          echo "Email preference controls compiled"
      - name: Publish generated assets for Render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A public/account
          if git diff --cached --quiet; then
            echo "Member site up to date"
          else
            git commit -m "build: publish saved member email preferences UI"
            git push origin HEAD:main
          fi
