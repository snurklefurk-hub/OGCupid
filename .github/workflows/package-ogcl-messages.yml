name: Package OGC-L private messaging member Function
on:
  push:
    branches: [feature/ogcl-private-messages-20261118]
    paths:
      - 'api/member-messages.js'
      - 'api/member-profile.ts'
      - '.github/workflows/package-ogcl-messages.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build and test validated member Function
        run: |
          npm ci
          npm install --no-save esbuild@0.25.12
          node --test api/member-messages.test.js api/member-quickmatch.test.js api/discovery-route.test.js
          npx esbuild api/member-profile.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile="$RUNNER_TEMP/index.mjs"
          node --check "$RUNNER_TEMP/index.mjs"
          (cd "$RUNNER_TEMP" && zip -9 -q members.zip index.mjs)
          base64 -w0 "$RUNNER_TEMP/members.zip" > dev/ogcl-messages-members-function.b64
      - name: Commit deployable credential-free bundle to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dev/ogcl-messages-members-function.b64
          if ! git diff --cached --quiet; then
            git commit -m "build: package private member messaging Function"
            git pull --rebase origin feature/ogcl-private-messages-20261118
            git push origin HEAD:feature/ogcl-private-messages-20261118
          fi
