<!doctype html><html lang="en"><meta charset="utf-8"><title>OG Cupid account</title><script>
    (function(){
      var url=new URL(location.href);
      var oldHash=String(location.hash||"").toLowerCase();
      var map={"#welcome-title":"/onboarding","#member-title":"/matches",
        "#profile-title":"/profile","#photos-title":"/photos",
        "#question-title":"/questions","#questions-title":"/questions",
        "#settings-title":"/account","#preview-title":"/profile"};
      var destination=url.searchParams.get("join")==="1"?"/join":
        url.searchParams.has("recover")?"/recover":map[oldHash]||"/signin";
      location.replace("/#"+destination);
    }());
  </script><a href="/#/signin">Continue to OG Cupid</a></html>
