<script>
/* Render's static-site rewrite is configured separately. This 404 fallback
   still boots authenticated client routing for direct /profiles/{slug} links
   until the rewrite rule is active. No member data exists in this HTML. */
(function () {
  var route=/^\/profiles\/[a-z0-9]+(?:-[a-z0-9]+)*(?:\/)?$/;
  if (!route.test(location.pathname)) return;
  fetch("/profiles/index.html", {cache:"no-store"}).then(function (response) {
    if (!response.ok) throw new Error("Profile route unavailable");
    return response.text();
  }).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function () { location.replace("/"); });
})();
</script>
