<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>OG Cupid</title>
<script>
  const profile = location.pathname.match(/^\/profiles\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/);
  const tab = location.hash.slice(1).toLowerCase();
  const suffix = ["photos", "questions", "personality"].includes(tab) ? "?tab=" + tab : "";
  location.replace(profile ? "/#/profiles/" + profile[1] + suffix : "/#/not-found");
</script>
<a href="/#/not-found">Continue to OG Cupid</a>
</html>
