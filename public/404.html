<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>OG Cupid</title>
  <script>
    // Static-host fallback for dynamic profile and message-thread routes.
    // The canonical root loads BrowserRouter and restores this same-origin
    // path with history.replaceState BEFORE React mounts. No #/ links.
    // Unknown paths continue to React's regular "Page not found" view.
    location.replace("/?__ogc_route="+encodeURIComponent(
      location.pathname+location.search+location.hash));
  </script>
</head>
<body><p><a href="/">Continue to OG Cupid</a></p></body>
</html>
